; ShaderOverridePlugin_InMemory — Plugin Configuration
;
; This file defines which engine shaders to hook and what configurable
; #define values each one exposes in Project Settings > Plugins > Shader Override.
;
; The [Shaders] section lists every hook.  Each hook gets its own section
; (keyed by TemplateFilename) that lists the configurable defines.
;
; Users edit values in Project Settings; those values are persisted in the
; project's DefaultShaderOverride.ini.  The DefaultValue here is only used
; the first time a define appears.
;
; Well-known defines (CUSTOM_TONEMAP_MODE, AGX_LOOK, CUSTOM_DIFFUSE_MODE,
; CUSTOM_SPEC_MODE) are presented as typed UENUM dropdown menus in the
; settings panel.  All other defines appear as generic text fields.
;
; CUSTOM_DIFFUSE_MODE values (kept in sync with ECustomDiffuseMode in
; ShaderShiftSettings.h):
;     0 = Engine Default (Lambert / Chan / EON)
;     1 = Energy-conserving Oren-Nayar (QON)
;     2 = Disney Burley
;     3 = Lambert-Sphere [d'Eon 2021]
;     4 = Gotanda [tri-Ace]
;
; CUSTOM_SPEC_MODE values (kept in sync with ECustomSpecMode):
;     0 = Engine Default (Single-Lobe GGX)
;     1 = Multi-Lobe Cinematic
;
; When CUSTOM_SPEC_MODE = 1, the diffuse paths apply per-model dual-lobe
; energy compensation automatically.  See BRDF.ush header for the model.
;
; CUSTOM_BLOOM_MODE values (kept in sync with ECustomBloomMode):
;     0 = Engine Default
;     1 = Dual Kawase Blur
;     2 = COD Scatter-as-Gather (Karis 13 / Tent 9)
;     3 = FFT Diffraction Starburst
;     4 = Anamorphic Lens Streak
;     5 = Spencer Ocular PSF
;     6 = Anime / Toon Hard Glow
;     7 = Retro / CRT-style Glow
;
; The bloom mode flows through two engine shader files; each one is hooked
; below.  Both read CUSTOM_BLOOM_MODE from the same #define.  The kernel
; helpers are inlined directly into each patched shader (no shared header).

[Shaders]
+Shader=(VirtualPath="/Engine/Private/PostProcessCombineLUTs.usf", TemplateFilename="PostProcessCombineLUTs.usf", DisplayName="Tone Mapping")
+Shader=(VirtualPath="/Engine/Private/BRDF.ush", TemplateFilename="BRDF.ush", DisplayName="BRDF", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/ShadingModels.ush", TemplateFilename="ShadingModels.ush", DisplayName="Shading Models", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/PostProcessBloom.usf", TemplateFilename="PostProcessBloom.usf", DisplayName="Bloom")
+Shader=(VirtualPath="/Engine/Private/Bloom/BloomResizeKernel.usf", TemplateFilename="Bloom/BloomResizeKernel.usf", DisplayName="FFT Bloom Kernel")

; ---------------------------------------------------------------------------
; PostProcessCombineLUTs.usf — Tone Mapping
; ---------------------------------------------------------------------------

[PostProcessCombineLUTs.usf]
+Define=(DefineName="CUSTOM_TONEMAP_MODE", DisplayName="Tonemapper", Description="Tone mapping operator (controlled by dropdown above)", DefaultValue="0")
+Define=(DefineName="AGX_LOOK", DisplayName="AgX Look", Description="AgX creative look (controlled by dropdown above)", DefaultValue="2")
+Define=(DefineName="CUSTOM_BLOOM_PRESERVE_COLOR", DisplayName="Preserve Emissive Color", Description="When 1, applies a hue-preserving highlight correction after the tonemapper so bright emissive cores keep their colour (pre-4.17 Unreal behaviour). Controlled by the checkbox in the Bloom section.", DefaultValue="0")

; ---------------------------------------------------------------------------
; BRDF.ush — BRDF mode selectors + multi-lobe specular configuration
;
; NOTE: CUSTOM_DIFFUSE_MODE and CUSTOM_SPEC_MODE live in BRDF.ush (not
; ShadingModels.ush), so all BRDF-related defines belong in this section.
; ---------------------------------------------------------------------------

[BRDF.ush]
+Define=(DefineName="CUSTOM_DIFFUSE_MODE", DisplayName="Diffuse BRDF", Description="Diffuse shading model (controlled by dropdown above). 0=Engine Default, 1=Oren-Nayar, 2=Burley, 3=Lambert-Sphere, 4=Gotanda", DefaultValue="0")
+Define=(DefineName="CUSTOM_SPEC_MODE", DisplayName="Specular BRDF", Description="Specular shading model (controlled by dropdown above). 0=Engine Default (Single-Lobe GGX), 1=Multi-Lobe Cinematic. When set to 1, diffuse paths apply per-model dual-lobe energy compensation automatically.", DefaultValue="0")
+Define=(DefineName="CUSTOM_SPEC_PRIMARY_WEIGHT", DisplayName="Specular Primary Weight", Description="Weight of the primary (sharp) lobe.  Secondary gets (1 - this).  Range 0.0 - 1.0", DefaultValue="0.7")
+Define=(DefineName="CUSTOM_SPEC_PRIMARY_ROUGHNESS_SCALE", DisplayName="Primary Roughness Scale", Description="Roughness multiplier for the sharp primary lobe.  < 1.0 = tighter than material roughness", DefaultValue="0.45")
+Define=(DefineName="CUSTOM_SPEC_SECONDARY_ROUGHNESS_SCALE", DisplayName="Secondary Roughness Scale", Description="Roughness multiplier for the soft secondary lobe.  > 1.0 = wider than material roughness", DefaultValue="2.2")
+Define=(DefineName="CUSTOM_SPEC_SECONDARY_MAX_ROUGHNESS", DisplayName="Secondary Max Roughness", Description="Clamp for the secondary lobe to avoid extreme blur.  Range 0.0 - 1.0", DefaultValue="0.95")

; ---------------------------------------------------------------------------
; ShadingModels.ush — no configurable defines (hook retained for future use)

; ---------------------------------------------------------------------------
; Bloom shaders — single CUSTOM_BLOOM_MODE drives all four bloom-pipeline
; files.  They all #include BloomShift.ush and dispatch through the matching
; BloomShift_* function for their stage.  Setting CUSTOM_BLOOM_MODE to 0
; restores the engine default for every stage.
; ---------------------------------------------------------------------------

[PostProcessBloom.usf]
+Define=(DefineName="CUSTOM_BLOOM_MODE", DisplayName="Bloom Mode", Description="Bloom kernel/look (controlled by dropdown above). 0=Engine, 1=Dual Kawase, 2=COD Scatter-as-Gather, 3=FFT Diffraction, 4=Anamorphic Streak, 5=Spencer Ocular, 6=Anime Hard Glow, 7=Retro CRT", DefaultValue="0")

[BloomResizeKernel.usf]
+Define=(DefineName="CUSTOM_BLOOM_MODE", DisplayName="Bloom Mode", Description="Procedural FFT bloom kernel (active when bloom mode = 3 or 5)", DefaultValue="0")
